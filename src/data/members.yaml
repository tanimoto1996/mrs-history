members:
  - id: omori-motoki
    name: 大森元貴
    part: Vo/Gt
    current: true
    facts:
      - kind: official
        text: ボーカルとギターを担当する。
        sources:
          - official-profile
        evidence: 大森元貴 (Vo/Gt)、若井滉斗 (Gt)、藤澤涼架 (Key)による3人組バンド。
      - kind: official
        text: 誕生日は9月14日。
        sources:
          - fc-birthday-omori
        evidence: 2025年9月14日(日)、大森元貴が誕生日を迎えます！
      - kind: official
        text: バンドの全曲の作詞・作曲・編曲を手がけ、アートワークやMVのアイデアまで楽曲に関わるすべてを担当している。
        sources:
          - um-omori-bio
        evidence: Mrs. GREEN APPLE では全楽曲の作詞／作曲／編曲、 さらに作品のアートワークおよびミュージックビデオのアイデアまで、楽曲に関するすべての要素を担当している。
      - kind: official
        text: 2021年2月24日、ソロデビュー曲「French」を配信リリースした。
        sources:
          - um-omori-french
        evidence: 大森元貴ソロデビュー曲「French」配信リリース決定 ／ ※本リンクは2月24日(水)AM0:00より有効となります
      - kind: official
        text: 俳優として2025年のNHK連続テレビ小説『あんぱん』に出演し、映画『#真相をお話しします』で映画初出演・初主演を務めた。
        sources:
          - um-omori-bio
        evidence: "NHK 連続テレビ小説『あんぱん』に出演、 4 月 25 日 ( 金 ) 全国公開の映画「 # 真相をお話しします」では映画初出演にして初主演を務め"
      - kind: official
        text: 1996年生まれ。
        sources:
          - um-omori-bio
        evidence: 1996年生まれの音楽家。
      - kind: official
        text: 2024年の年間Billboard JAPAN作詞家チャートと作曲家チャートで、2年連続の1位を獲得した。
        sources:
          - um-omori-bio
        evidence: 大森は、2024年年間Billboard JAPAN作詞家チャート、及び作曲家チャートで、2年連続となる１位を獲得している。
      - kind: official
        text: 2024年9月公開の映画「The White Lounge in CINEMA」で、プランナー兼ジェネラルプロデューサーを務めた。
        sources:
          - um-omori-bio
        evidence: 大森は同作でプランナー＆ジェネラルプロデューサーを務めており
      - kind: official
        text: 2021年8月6日、ソロの2nd Digital EP「Midnight」をリリースした。
        sources:
          - um-omori-midnight
        evidence: Motoki Ohmori 2nd Digital EP ‘Midnight’ 2021.08.06 Release！
      - kind: official
        text: ソロEP「French」収録曲「メメント・モリ」を絵本にし、2021年9月15日にKADOKAWAから発売した。初の著書にあたる。
        sources:
          - um-omori-ehon
          - um-omori-ehon-tokuten
        evidence: ソロデビューEP‘French’収録の名曲『メメント・モリ』の絵本としてのリリースが決定しました！2021年9月15日(水)発売 ／ 発行：株式会社KADOKAWA ／ 大森元貴の初の著書となる絵本『メメント・モリ』
      - kind: official
        text: 2025年5月28日、3rd Digital Single「絵画」を配信した。カップリングは「こたえあわせ」。
        sources:
          - um-omori-kaiga
        evidence: 5月28日(水)に大森元貴3rd Digital Single「絵画」の配信が決定しました。
      - kind: official
        text: 「こたえあわせ」は、NHK Eテレ「天才てれびくん」に提供した曲。
        sources:
          - um-omori-kotaeawase
        evidence: NHK Eテレ「天才てれびくん」へ楽曲提供した『こたえあわせ』
      - kind: official
        text: 2025年7月8日発売の「ニューズウィーク日本版」7/15号で表紙を飾った。
        sources:
          - um-omori-newsweek
        evidence: 大森元貴が7月8日(火)発売「ニューズウィーク日本版 Newsweek Japan 7/15号」に表紙掲載されます。
      - kind: official
        text: 2026年8月26日配信の5th Digital Single「灰色」は、映画『白鳥とコウモリ』の主題歌。
        sources:
          - um-omori-haiiro
        evidence: 8月26日(水)に5th Digital Single『灰色』の配信が決定しました。 映画『白鳥とコウモリ』主題歌
      - kind: official
        text: ソロ活動は、自分の心身の健康のためにやるべきことだと考えていたと話している。
        sources:
          - bb-omori-kaiga-2025
        evidence: ソロ活動は、自分の心身の健康上、やるべきことだと思っていたんです。
      - kind: official
        text: 自分の中ではミセスが交感神経、ソロが副交感神経のようなものだと例えている。
        sources:
          - bb-omori-kaiga-2025
        evidence: 僕の中でミセスは交感神経で、ソロは副交感神経だと思っているんですよ。
      - kind: official
        text: タイアップ曲を作るのも大好きだと話している。
        sources:
          - bb-omori-kaiga-2025
        evidence: 僕はタイアップで楽曲を作るのも大好きなので
      - kind: official
        text: 歌詞は曲を作る時間の中で短時間に集中して書くことが多く、後で読み返して「こんなこと書いてんだ」と思うことが多いという。
        sources:
          - bb-omori-kaiga-2025
        evidence: すごく短時間でグッと集中して作った歌詞を終わった後に読み返すと、「ああ、こんなこと書いてんだ」って思うことが多いです。
      - kind: official
        text: 「絵画」のダンスは一日で習得するしかなく、3時間で振りを覚えたという。
        sources:
          - bb-omori-kaiga-2025
        evidence: 3時間で振りを覚えて、「はい終わり！」って言って帰りました（笑）。
      - kind: official
        text: 初めて曲を作ったのは12歳、小学6年生のころ。当時作った曲の中には、デビュー後にリリースしたものもあるという。
        sources:
          - mdpr-omori-12sai-2024
        evidence: 「楽曲を初めて作ったのは12歳の小学6年生の頃」だという大森。「デビューしてからリリースする楽曲も当時作った楽曲も何曲かあったり…」
      - kind: official
        text: 小学校の卒業式でバンドを組み、自分で作詞作曲したオリジナル曲を披露したことが、音楽の道に進むきっかけになった。
        sources:
          - mdpr-shabekuri-2024
        evidence: 音楽を始めたきっかけは小学校の卒業式で、バンドを結成し大森自ら作詞作曲したオリジナル曲も披露。これが大森の契機となり「『もうこれで行くんだ！』と音楽の道を決めた」
      - kind: official
        text: 若井とは中学校の同級生。最初は苦手に感じていたが、ギターを始めた若井とスタジオに入ったとき、「この人とバンドをやるかも」と思ったという。
        sources:
          - mdpr-omori-12sai-2024
        evidence: ギターを始めた若井とスタジオに行ったことで「この人とやるかも、バンド」と思ったと当時を振り返った。
      - kind: official
        text: 藤澤をメンバーに誘ったのは、大森が藤澤の人柄にほれ込んだからだという。
        sources:
          - mdpr-shabekuri-2024
        evidence: 藤澤の加入は、大森が人柄に惚れ込みメンバーに誘ったことからだという
      - kind: official
        text: 大森と若井は16歳でミセスを組み、18歳でメジャーデビューした。フェーズ1の終盤はどこか孤独だったので、活動休止した意味があったと話している。
        sources:
          - realsound-phase2-2022
        evidence: 僕ら（大森、若井）は16歳でミセスを組んで、18歳でメジャーデビューしたんですけど ／ フェーズ1の終盤はどこか孤独だったので、活動休止した意味があるなと思います。
      - kind: official
        text: 2025年、キリンビール「キリングッドエール」のブランドリーダーに就任し、同年9月29日から出演CMが放送された。
        sources:
          - natalie-goodale-2025
        evidence: ミセス大森元貴が「キリングッドエール」ブランドリーダー就任、本日より出演CMオンエア
  - id: wakai-hiroto
    name: 若井滉斗
    part: Gt
    current: true
    facts:
      - kind: official
        text: ギターを担当する。
        sources:
          - official-profile
        evidence: 大森元貴 (Vo/Gt)、若井滉斗 (Gt)、藤澤涼架 (Key)による3人組バンド。
      - kind: official
        text: 誕生日は10月8日。
        sources:
          - fc-birthday-wakai
        evidence: 2025年10月8日(水)、若井滉斗が誕生日を迎えます！
      - kind: official
        text: 中学2年生のとき、兄のストラトキャスターを借りてギターを弾き始めた。
        sources:
          - fender-wakai-2024
        evidence: 中学2年生の時に兄のStratocasterを借りて弾くようになりました。
      - kind: official
        text: 当時はオフスプリングやグリーン・デイなど、パワーコードをかき鳴らすパンク系の曲をたくさんコピーしていた。
        sources:
          - fender-wakai-2024
        evidence: 大音量でパワーコードをかき鳴らすようなパンク系の曲をたくさんコピーしました。オフスプリング、グリーン・デイとかを当時から好きで聴いていたんです。
      - kind: official
        text: 高校生のころ、兄の影響でTHEE MICHELLE GUN ELEPHANTも聴き始めた。
        sources:
          - fender-wakai-2024
        evidence: 高校生になったあたりからは兄の影響でTHEE MICHELLE GUN ELEPHANTも聴き始めて
      - kind: official
        text: 自身のルーツはロックやパンクで、それを生かしつつ大森の曲に合う要素を取り入れて今のギタースタイルになったと話している。
        sources:
          - fender-wakai-2024
        evidence: 僕はわりとロックやパンクがルーツで、そこを反映しつつも、最近のさまざまな音楽や大森が作る曲に合うような要素も取り入れながら今のギタースタイルに至っています。
      - kind: official
        text: 大森の曲は毎回想像以上で、レコーディングのたびに壁を感じるが、それを乗り越えるのが楽しいと語っている。
        sources:
          - fender-wakai-2024
        evidence: 大森が作る曲は毎回想像以上なので、レコーディングで毎回壁のようなものを感じますね。
      - kind: official
        text: 中学時代、学校に来ていなかった大森の家まで、通学路が逆なのに毎朝迎えに行っていたとテレビ番組で振り返った。
        sources:
          - mdpr-shabekuri-2024
        evidence: 「通学路真逆なんですけど、元貴の家まで行ってピンポン毎朝押して、『今日来る？』」と中学時代の2人の関係を回顧。
      - kind: official
        text: 行事にだけ登校していた大森と、修学旅行のときに意気投合した。
        sources:
          - mdpr-shabekuri-2024
        evidence: 修学旅行の際に若井と意気投合し登校を再開。
      - kind: official
        text: 大森とバンドを組むと音楽に没頭し、才能ある大森に「なんとかして付いていかなきゃ」と努力したという。
        sources:
          - mdpr-shabekuri-2024
        evidence: 大森とバンドを組むことになると、若井は音楽に没頭。才能ある大森に「なんとかして付いていかなきゃ」と努力したというが
      - kind: official
        text: 藤澤の加入当初は、年上で派手な見た目の藤澤を「チャラくてなんか嫌だな」と思っていたと明かした。大森によると、距離を縮めるために一緒に住んだことなどで、若井も藤澤の人柄の良さを理解していったという。
        sources:
          - mdpr-shabekuri-2024
        evidence: 年上で派手な見た目の藤澤に「チャラくてなんか嫌だな」とかなり不本意だったと告白。
      - kind: official
        text: 2024年4月に始まったテレビ朝日の音楽バラエティ「M:ZINE」にMCとしてレギュラー出演した。1人でのバラエティ出演はこれが初めてだった。
        sources:
          - natalie-mzine-2024
        evidence: このように、１人でバラエティー番組に出させていただくのは初めてなので、とても緊張しましたが
      - kind: official
        text: 2026年度のNHK Eテレ「ハングルッ！ナビ」に4月から生徒役として出演している。K-POPが好きで、ハングルを学んだ経験がある。
        sources:
          - radiko-hangul-2026
        evidence: K-POPが好きでハングルも学んだ経験のある若井が、視聴者とともにハングルを学んでいきます。
  - id: fujisawa-ryoka
    name: 藤澤涼架
    part: Key
    current: true
    facts:
      - kind: official
        text: キーボードを担当する。
        sources:
          - official-profile
        evidence: 大森元貴 (Vo/Gt)、若井滉斗 (Gt)、藤澤涼架 (Key)による3人組バンド。
      - kind: official
        text: 誕生日は5月19日。
        sources:
          - fc-birthday-fujisawa
        evidence: 2026年5月19日(火)、藤澤涼架が誕生日を迎えます！
      - kind: official
        text: 中学の吹奏楽でフルートを始め、高校は音楽科にフルート専科・ピアノ副科として進んだ。
        sources:
          - entax-anothersky-2025
        evidence: 「中学生から吹奏楽でフルートをやり始めて、高校も音楽科の学校で、フルート専科、ピアノが副科というかたちで入学しました」
      - kind: official
        text: 子どものころからステージで輝くポップスの世界に憧れがあり、18歳のとき「やらない後悔」より飛び込むことを選んだ。そのころ大森に誘われてバンドに入った。
        sources:
          - entax-anothersky-2025
        evidence: 「やらない後悔がずっと残るよりも、一回、思いっきり飛び込んでみようかなと、18歳の頃に思いました」
      - kind: official
        text: バンドではキーボード担当だが、クラシカルな曲では長年続けてきたフルートも演奏する。愛用のフルートはドイツ・オッテンバッハの工房「メナート」製で、2025年の「アナザースカイ」でその工房を訪ねた。
        sources:
          - entax-anothersky-2025
        evidence: 今回訪れたオッテンバッハは、そんな藤澤が愛用するフルートが作られた場所だった。
      - kind: official
        text: 加入は、大森が藤澤の人柄にほれ込んで誘ったことがきっかけだった。
        sources:
          - mdpr-shabekuri-2024
        evidence: 藤澤の加入は、大森が人柄に惚れ込みメンバーに誘ったことからだという
      - kind: official
        text: 加入当初は演奏力の差から観客に「あのキーボードいる？」と言われたこともあり、「余計派手にしなきゃ」と考えていたと明かした。
        sources:
          - mdpr-shabekuri-2024
        evidence: 演奏力の差がゆえに観客から「あのキーボードいる？」と指摘を受けたこともあり「余計派手にしなきゃ」と考えていたと明かされた。
      - kind: official
        text: 2026年1月からのTBS日曜劇場『リブート』で霧矢直斗を演じ、連続ドラマに初出演した。
        sources:
          - oricon-reboot-2026
        evidence: 藤澤が演じる霧矢直斗は、永瀬が演じる冬橋とバディを組んでいる仲間。
      - kind: official
        text: 『リブート』の会見では、大森から「自分の生業を忘れるな」と言われていたと話し、「俳優ではないから妥協するという意味ではない」、俳優と一緒にやらせてもらうからこそ人一倍頑張らなければいけないと語った。
        sources:
          - oricon-reboot-2026
        evidence: 「俳優ではないから妥協するという意味ではない。俳優と一緒にやらせてもらうからこそ、人一倍頑張らなきゃいけないポイントがある」
      - kind: official
        text: 『リブート』最終回の後、インスタグラムで「霧矢と向き合った時間は一生忘れられないものになりました」とつづった。
        sources:
          - oricon-reboot-final-2026
        evidence: 「霧矢（役名）と向き合った時間は一生忘れられないものになりました」と藤澤。
      - kind: official
        text: TOKYO FM「SCHOOL OF LOCK!」内の「ミセスLOCKS!」は、2026年5月から藤澤が単独で担当している。
        sources:
          - mdpr-locks-2026
        evidence: 「なんと！5月からの『ミセスLOCKS！』は…！！！私、藤澤涼架が単独で授業を受け持つことになりました！！」
      - kind: official
        text: 長野県出身。単独になった「ミセスLOCKS!」の初回で、長野県歌「信濃の国」は6番まで全部歌えると話した。
        sources:
          - tfm-nagano-2026
        evidence: 私、藤澤も長野出身ですので。
      - kind: official
        text: 雪見だいふくが子どものころから大好きで、2026年9月には雪見だいふくのイベントにサプライズで登場した。
        sources:
          - natalie-yukimi-2026
        evidence: 「子供の頃から大好きで家族でも食べていましたし、上京してからも食べていました。超大好きです！」
  - id: yamanaka-ayaka
    name: 山中綾華
    part: Dr
    current: false
    facts:
      - kind: official
        text: ドラムを担当していた。2021年12月30日、この日をもって脱退することが公式サイトで発表された。
        sources:
          - oricon-departure
        evidence: 山中綾華（Dr）と高野清宗（B）が、きょう30日をもって脱退すると同日、バンドの公式サイトで発表された。
      - kind: official
        text: 脱退は本人からの申し出によるもので、メンバーとスタッフで話し合いを重ねたと発表された。
        sources:
          - oricon-departure
        evidence: 「2人からそれぞれ申し出があり、メンバー、スタッフで話し合いを重ねました。
      - kind: official
        text: 本人はコメントで、新しくやりたいことや夢に向かって進んでいると述べた。
        sources:
          - oricon-departure
        evidence: 私はいま、新しくやりたいこと、その夢に向かって進んでいます。
  - id: takano-kiyokazu
    name: 髙野清宗
    part: B
    current: false
    facts:
      - kind: official
        text: ベースを担当していた。2021年12月30日、この日をもって脱退することが公式サイトで発表された。
        sources:
          - oricon-departure
        evidence: 山中綾華（Dr）と高野清宗（B）が、きょう30日をもって脱退すると同日、バンドの公式サイトで発表された。
      - kind: official
        text: 本人はコメントで、バンドで過ごした時間と出会いを宝物だと述べた。
        sources:
          - oricon-departure
        evidence: Mrs. GREEN APPLEとして過ごした全ての時間、全ての出逢いが大切な宝物です。
band:
  facts:
    - kind: official
      text: 2013年に結成し、2015年にEMI Recordsからミニアルバム『Variety』でメジャーデビューした。
      sources:
        - official-profile
      evidence: 2013年結成。2015年EMI Recordsからミニアルバム『Variety』でメジャーデビュー。
    - kind: official
      text: 2人の脱退時点では5人組で、脱退発表の際、バンドは2022年の「フェーズ2」開幕に向けて準備を進めていると伝えた。
      sources:
        - oricon-departure
      evidence: 「引き続きMrs. GREEN APPLEは2022年のフェーズ2開幕に向けて着々と準備を進めております」
    - kind: official
      text: 残る3人はコメントで、歩む道は違っても2人とはこれからも家族だと述べた。
      sources:
        - oricon-departure
      evidence: 間違いないのは、歩む道は違えど、僕らはこれからも家族です。
    - kind: official
      text: 公式ファンクラブの名前は「Ringo Jam」。公式サイトの告知ではファンを「JAM'S」と呼んでいる。
      sources:
        - official-fc-entry
        - fc-birthday-fujisawa
      evidence: Mrs. GREEN APPLE OFFICIAL SITE｜OFFICIAL FAN CLUB 「Ringo Jam」 ／ JAM’Sの皆さまからBirthday Messageを大募集！
