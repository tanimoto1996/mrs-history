date: "2018-11-17"
title: ライブハウスツアー「ゼンジン未到とプロテスト～回帰編～」開幕
kind: live
description: 結成5周年の2018年、11月17日の札幌PENNY LANE24から12月25日の渋谷CLUB CRAWLまで、全国のライブハウスを回るツアーを行った。約1年半ぶりのライブハウスツアーで、シンプルな演出と初期の曲を多く含むセットリストだった。初日の札幌公演の映像・音源は、シングル「僕のこと」の初回限定盤DVDなどに収められた。
phase: phase1
relatedSongs: [藍, アンゼンパイ, soft-drink, 私, wall-flower, no-7]
evidence: 今年結成5周年を迎えた彼らは“回帰編”と題した約1年半ぶりのライブハウスツアーで、シンプルな演出と共に初期ナンバーを多く含むセットリストを展開した。
