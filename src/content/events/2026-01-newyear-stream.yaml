date: "2026-01-01"
title: 元日生配信でフェーズ3の幕開け、国立競技場公演などを発表
kind: media
description: フェーズ3が始まった1月1日15時から、YouTubeで「Mrs. GREEN APPLE 2026年 元日生配信」を行った。配信中にはニューヨーク・タイムズスクエアにミセスのビジュアルが映った。最後に、4月からの東京・国立競技場（MUFGスタジアム）4日間と大阪・ヤンマースタジアム長居での公演、ドームツアー「BABEL no TOH」の映画化を発表した。
phase: phase3
relatedSongs: []
evidence: さらに、ラストには、4月から東京・国立競技場（MUFGスタジアム）4DAYS、大阪・ヤンマースタジアム長居でのライブ開催を発表。『Mrs. GREEN APPLE DOME TOUR 2025 “BABEL no TOH”』の映画公開も明らかに。
