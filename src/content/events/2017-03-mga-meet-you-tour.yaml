description: 2ndアルバム『Mrs. GREEN APPLE』を携えた全20公演のツアー。3月から前半はライブハウス、後半は会館・ホールを回り、5月19日の東京国際フォーラム ホールAで終えた。ファイナルでは「Lion」「おもちゃの兵隊」「鯨の唄」などを演奏し、その映像の一部はシングル『WanteD! WanteD!』初回盤に収録された。
