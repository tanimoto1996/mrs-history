date: "2025-11-28"
title: ライブフィルム『FJORD ON SCREEN』と初のドキュメンタリー映画を同時公開
kind: media
description: 11月28日、野外ライブ「FJORD」を収めたライブフィルム「MGA MAGICAL 10 YEARS ANNIVERSARY LIVE ～FJORD～ ON SCREEN」と、バンド初のドキュメンタリー映画「MGA MAGICAL 10 YEARS DOCUMENTARY FILM ～THE ORIGIN～」を同時に全国公開した。ドキュメンタリーは新曲「Variety」ができるまでの過程に密着し、大森元貴が曲をゼロから作る制作現場を初めて見せた。
phase: phase2
relatedSongs: [variety]
evidence: デビュー10周年プロジェクトをスタートさせた彼らの素顔と、新曲「Variety」が生み出されるまでの創作過程に完全密着しており、タイトルは『MGA MAGICAL 10 YEARS DOCUMENTARY FILM ～THE ORIGIN～』に決定した。
