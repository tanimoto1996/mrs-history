date: "2026-04-18"
title: スタジアムツアー『ゼンジン未到とイ/ミュータブル～間奏編～』、バンド初の国立競技場4日間
kind: live
description: インディーズ時代から続く「ゼンジン未到」シリーズとして、4月18日・19日と7月4日・5日に東京・MUFGスタジアム（国立競技場）、5月4日・5日に大阪・ヤンマースタジアム長居で計6公演を行った（5月と7月はファンクラブ限定）。国立競技場での4日間公演は嵐以来2組目で、バンドでは初めて。全6公演で39万人を集め、7月5日のファイナルでは2024年以来となる「アポロドロス」も演奏した。
phase: phase3
relatedSongs: [アポロドロス, magic, familie, carrying-happiness, ケセラセラ]
evidence: 全6公演で合計39万人を動員。さらにツアーファイナルの配信、ライブビューイング、カラオケビューイングとあわせると、ツアートータルで57万人を動員する規模となった。なお、MUFGスタジアムでの4日間公演は嵐以来2組目、バンドとしては史上初の快挙だ。
