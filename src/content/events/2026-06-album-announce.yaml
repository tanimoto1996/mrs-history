date: "2026-06-15"
title: 6作目のアルバムと約3年ぶりのアリーナツアー“SHADOWS”を発表
kind: milestone
description: 6月15日、6作目のオリジナルフルアルバムを9月30日に出し、同じ日に約3年ぶりのアリーナツアー「Mrs. GREEN APPLE Ringo Jam Tour “SHADOWS”」を始めると発表した。アルバムには「FJORD」で初披露した「Variety」のほか、「Carrying Happiness」「夏の影」「GOOD DAY」「lulu.」「風と町」などが入る予定とされた。アルバムの予約特典「GREEN CODE」でツアーの先行予約に申し込める仕組みにした。
phase: phase3
relatedSongs: [variety, carrying-happiness, 夏の影, good-day, lulu, 風と町]
evidence: Mrs. GREEN APPLEの6作目のオリジナルフルアルバム（タイトル未定）が9月30日にリリースされることが決定。同日に約3年ぶりのアリーナツアー「Mrs. GREEN APPLE Ringo Jam Tour “SHADOWS”」がスタートすることも発表された。
