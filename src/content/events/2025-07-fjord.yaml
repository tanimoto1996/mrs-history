date: "2025-07-26"
title: 10周年野外ライブ『FJORD』で10万人、新曲「Variety」初披露
kind: live
description: 7月26日・27日、神奈川・山下ふ頭特設会場でデビュー10周年記念の野外ライブ「MGA MAGICAL 10 YEARS ANNIVERSARY LIVE ～FJORD～」を開き、2日間で計10万人を集めた。10周年とこの公演のために大森元貴が書き下ろした新曲「Variety」を初披露し、「アンゼンパイ」「WaLL FloWeR」「道徳と皿」など初期の曲も演奏した。最後はデビュー曲「StaRt」で締め、1200機のドローンが空に文字を描いた。
phase: phase2
relatedSongs: [variety, アンゼンパイ, wall-flower, 道徳と皿, 我逢人, start, コロンブス]
evidence: バンドのデビュー10周年、そしてこの「FJORD」開催に際して、バンドのこれまでと今を描くために大森が新たに書き下ろしたという新曲「Variety」が披露される
