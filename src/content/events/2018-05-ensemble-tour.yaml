date: "2018-05-12"
title: ホールツアー「ENSEMBLE TOUR」開幕
kind: live
description: 2018年4月発表の3rdアルバム『ENSEMBLE』を携えたホールツアーが、5月12日に東京・パルテノン多摩で開幕した。エンタテインメントショーのようなセットで新旧の曲を披露し、照明や映像の演出も見どころとされた。5月から9月にかけて全国を回り、千葉・幕張メッセ国際展示場の2日間でファイナルを迎える日程だった。
phase: phase1
relatedSongs: []
evidence: このツアーはミセスが4月に発表した最新アルバム「ENSEMBLE」を携えて行っているもの。
