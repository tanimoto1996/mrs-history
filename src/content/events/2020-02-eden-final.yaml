date: "2020-02-16"
title: 『エデンの園』代々木第一体育館でツアーファイナル
kind: live
description: 2月15日・16日に国立代々木競技場第一体育館で「ARENA TOUR / エデンの園」の追加公演を行い、16日がツアーファイナルとなった。「インフェルノ」で始まり、アルバム『Attitude』の曲、インディーズ時代やデビュー当時の曲、代表曲を合わせたセットリストだった。ナタリーはこの公演を「第1章の集大成」と報じた。
phase: phase1
