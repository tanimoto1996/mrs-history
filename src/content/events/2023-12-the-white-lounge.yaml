description: 『Atlantis』で発表された6年ぶりのファンクラブツアー。12月20日のJ:COMホール八王子から2024年3月3日の東京ガーデンシアターまで、全国のホールを回った。『The ROOM TOUR』に続くコンセプトツアーで、2024年2月には東京国際フォーラム ホールAの追加公演もあった。このツアーはのちに映画『The White Lounge in CINEMA』になった。
