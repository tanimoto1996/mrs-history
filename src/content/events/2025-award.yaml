date: "2025-12-30"
title: 「ダーリン」で日本レコード大賞3年連続受賞
kind: award
description: 12月30日、「ダーリン」が「第67回 輝く！日本レコード大賞」を受賞し、2023年・2024年に続く3年連続の大賞となった。大森元貴は「3連覇という意味をすごく考えます」とコメントした。翌31日には紅白歌合戦に出て、同日でフェーズ2を完結した。
phase: phase2
relatedSongs: [ダーリン]
evidence: Mrs. GREEN APPLEが同賞を受賞するのは、2023年、2024年に続きこれが3度目。
