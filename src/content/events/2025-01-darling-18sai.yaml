date: "2025-01-20"
title: 「18祭」で1000人と歌った「ダーリン」を配信
kind: release
description: 2024年12月25日にNHK総合で放送された「Mrs. GREEN APPLE 18祭」のテーマソングとして書き下ろした「ダーリン」を、2025年1月20日に配信した。番組ではミセスが1000人の“18歳世代”とこの曲を合唱し、シングルには合唱を収めた“18祭バージョン”も収録された。
phase: phase2
relatedSongs: [ダーリン]
evidence: 「ダーリン」は昨年12月25日にNHK総合で放送された番組「Mrs. GREEN APPLE 18祭」のテーマソングとして書き下ろされた楽曲。番組ではミセスが1000人の“18歳世代”と一緒にこの曲を合唱した。
