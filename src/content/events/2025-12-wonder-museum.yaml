title: 10周年を締めくくる展覧会『Wonder Museum』開幕
kind: milestone
description: 12月6日、デビュー10周年を締めくくる展覧会「MGA MAGICAL 10 YEARS EXHIBITION『Wonder Museum』」を東京で始めた（2026年1月9日まで）。全曲を作ってきた大森元貴の頭の中を旅するという内容で、映像・造作・衣装・香りなどで曲の世界を体験できる。その後、2026年2月に福岡、3月に大阪を回った。
phase: phase2
relatedSongs: []
evidence: 今年デビュー10周年を迎えているMrs. GREEN APPLEのアニバーサリーイヤーを締めくくる企画となる展覧会「MGA MAGICAL 10 YEARS EXHIBITION『Wonder Museum』」が、いよいよ12月6日（土）よりスタートした。
