title: 『Attitude』に向けた3カ月連続先行配信、第3弾「CHEERS」
kind: release
description: 10月2日発売の4thアルバム『Attitude』に先立ち、新曲の3カ月連続先行配信を行い、その第3弾として9月19日から「CHEERS」を配信した。前日の9月18日にはTOKYO FM系『SCHOOL OF LOCK!』内「ミセスLOCKS!」で初めてオンエアされた。
phase: phase1
relatedSongs: [cheers]
evidence: 新曲3ヶ月連続先行配信の第3弾として、19日から「CHEERS」の配信をスタート。
