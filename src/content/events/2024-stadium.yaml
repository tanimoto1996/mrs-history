description: 2024年3月3日に発表され、チケットは5月に完売。7月6日・7日にノエビアスタジアム神戸、7月20日・21日に横浜スタジアムで計4公演を行い、計15万人を動員した。公式プロフィールでは日本のバンド史上最年少でのスタジアムツアーとしている。7月21日のツアーファイナルで、映画『The White Lounge in CINEMA』の9月13日公開を発表した。
