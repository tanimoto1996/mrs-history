date: "2016-12-08"
title: 『In the Morning Tour』、ファイナルを東京ドームシティホールで開催
kind: live
description: 3rdシングル『In the Morning』のリリース記念ツアーのファイナルを、2016年12月8日に東京ドームシティホールで開催した。チケットは即日完売し、3,200人が集まった。会場はバンドにとってワンマン史上最大規模だった。この日、2017年1月11日発売の2ndアルバム『Mrs. GREEN APPLE』のジャケット写真と、3月からのリリースツアー「MGA MEET YOU TOUR」が発表された。ファイナルは2017年4月5日に初の映像作品として発売された。
phase: phase1
