date: "2018-09-09"
title: 「ENSEMBLE TOUR」幕張メッセ2DAYSでファイナル
kind: live
description: 9月8日・9日、千葉・幕張メッセ国際展示場で「ENSEMBLE TOUR ～フェット・ドゥ・ラ・ルージュ～ / ～ソワレ・ドゥ・ラ・ブリュ～」を開催し、2日間で約2万人を集めた。バンド史上最大規模のステージで約3時間・29曲を披露し、この夏に出た「青と夏」や未発表曲も演奏した。9日の公演で、11月からのライブハウスツアー開催を発表した。9日公演は2019年1月に映像作品としてリリースされた。
phase: phase1
relatedSongs: [love-me-love-you, キコリ時計, 愛情と矛先, start, hello, oz, 日々と君, パブリック, アウフヘーベン, coffee, 鯨の唄, factory, ツキマシテハ, wanted-wanted, うブ, whoo-whoo-whoo, l-p, reverse, 青と夏, splash, speaking]
evidence: 最終地点の幕張メッセ国際展示場2DAYSには合計約2万人のオーディエンスが集まり、ライブを楽しんだ。ミセスはバンド史上最大規模となるステージにて、約3時間にわたり29曲というボリュームでライブを展開。
