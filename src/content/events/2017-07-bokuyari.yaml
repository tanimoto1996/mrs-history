date: "2017-07-18"
title: 「WanteD! WanteD!」がドラマ『僕たちがやりました』のオープニングテーマに
kind: media
description: 7月18日に始まったカンテレ／フジテレビ系ドラマ『僕たちがやりました』のオープニングテーマとして「WanteD! WanteD!」を書き下ろした。8月30日発売のシングルには、アニメ『ナナマル サンバツ』のオープニングテーマ「On My MiND」と、前年末のツアー会場で弾き語りで披露した「光のうた」のバンドアレンジも入った。
phase: phase1
relatedSongs: [wanted-wanted, on-my-mind, 光のうた]
evidence: 7月18日（火）から放送がスタートするカンテレ／フジテレビ系ドラマ"僕たちがやりました"オープニング・テーマに新曲「WanteD! WanteD!」を書き下ろした
sources:
  - { id: skream-bokuyari, title: "Mrs. GREEN APPLE、7月より放送の窪田正孝主演ドラマ\"僕たちがやりました\"OPテーマに新曲「WanteD! WanteD!」を書き下ろし。8/30にシングル・リリース", media: Skream!, url: "https://skream.jp/news/2017/06/mga_bokuyari_op-theme.php", date: "2017-06" }
