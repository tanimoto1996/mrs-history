date: '2023-05-20'
title: 結成10周年企画『Studio Session Live』をYouTubeで公開
kind: media
description: 結成10周年プロジェクトの一つとして、大森元貴の発案による特別アレンジのスタジオライブを、初ライブから10年目の5月20日（“青リンゴの日”）に公式YouTubeでプレミア公開した。披露曲の一つはファンのリクエストから決めた。第2弾は11月25日に公開された。
phase: phase2
relatedSongs: []
evidence: 5月20日と言えば、10年前にMrs. GREEN APPLEが初ライブを行った日であり、ファンの間で、通称“青リンゴの日”と呼ばれている記念日。
