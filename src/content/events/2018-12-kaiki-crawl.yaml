date: "2018-12-25"
title: ホームの渋谷CLUB CRAWLで「回帰編」ファイナル
kind: live
description: 初めてライブをしたライブハウスで、バンドのホームである渋谷CLUB CRAWLで、約3年ぶりにライブを行った。観客は200人。「我逢人」で始まり、未発表曲も披露した。アンコールでは、翌年1月9日に出るシングルの表題曲「僕のこと」を演奏した。
phase: phase1
relatedSongs: [我逢人, ナニヲナニヲ, 藍, アンゼンパイ, リスキーゲーム, soft-drink, whoo-whoo-whoo, reverse, simple, no-7, 青と夏, 私, wall-flower, start, wanted-wanted, 僕のこと]
evidence: 渋谷CLUB CRAWLはミセスにとって初めてライブを行ったライブハウスで、バンドのホームと言える場所。彼らにとって約3年ぶりとなる本会場でのライブには、チケットを手に入れた幸運な200人のファンが集まった。
