date: '2024-12-02'
title: 記者発表でデビュー10周年企画「MAGICAL 10 YEARS」を発表
kind: milestone
description: 12月2日に記者発表をYouTubeで生配信し、2025年のデビュー10周年企画「MGA MAGICAL 10 YEARS」を発表した。7月8日のベストアルバム『10』、7月26日・27日に横浜・山下ふ頭で2日間10万人規模を予定するライブ、2025年2月の初の韓国単独公演、初のドキュメンタリー映画などが含まれる。同じ日に、2023年に予告していた『Atlantis』の続編『“BABEL no TOH”』の開催決定も発表した。
phase: phase2
relatedSongs: []
evidence: 2025年7月26日(土)、27日(日)に神奈川県横浜市・山下ふ頭で ミセス史上最大規模となる、2日間で10万⼈を動員予定のライブ開催が決定！
