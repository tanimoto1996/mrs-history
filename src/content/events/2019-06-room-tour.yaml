date: "2019-06-28"
title: 音楽劇のようなホールツアー「The ROOM TOUR」
kind: live
description: 6月28日のよこすか芸術劇場から、全国12カ所16公演のホールツアーを行った。「家」をモチーフにした大きなセットで、MCをほとんど挟まない音楽劇のような内容だった。台風10号の影響で中止になった8月15日の大阪公演の振替を9月17日に大阪・フェスティバルホールで行い、完結した。7月4日の東京・NHKホール公演から9曲が『Attitude』初回限定盤DVDに収められた。
phase: phase1
relatedSongs: [hug, 絶世生物, ノニサクウタ, in-the-morning, wanted-wanted, 僕のこと, ロマンチシズム, 青と夏, how-to]
evidence: 大阪・フェスティバルホールで全国ホールツアー『The ROOM TOUR』（12ヶ所16公演）のファイナルを迎えた。
