date: "2026-07-03"
title: 映画『スパイダーマン：ブランド・ニュー・デイ』日本版主題歌に決定
kind: milestone
description: 7月3日、7月31日に日米同時公開の映画「スパイダーマン：ブランド・ニュー・デイ」の日本版主題歌を担当すると、マーベル・スタジオ社長ケヴィン・ファイギの動画で発表された。デビュー当時からスパイダーマンの大ファンだと公言していたミセスが「Brand New」を書き下ろした。制作にあたって2月にロサンゼルスのソニー・ピクチャーズ スタジオを訪れ、ファイギらと話し合った。曲は7月13日に配信された。
phase: phase3
relatedSongs: [brand-new]
evidence: デビュー当時からスパイダーマンの大ファンであることを公言してきたミセスは、本作のために日本版主題歌「Brand New」を書き下ろした。
