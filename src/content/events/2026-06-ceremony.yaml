date: "2026-06-10"
title: 『CEREMONY』2回目を2日間で開催
kind: live
description: 6月10日・11日、Kアリーナ横浜で2回目の「Mrs. GREEN APPLE presents 『CEREMONY』」を開いた。前年の初回に続くもので、今回は2日間になり、計13組が出演した。1日目のグリーンカーペットでは、ミセスの3人が「オズの魔法使い」の世界を表した衣装で登場した。2027年も6月16日・17日にKアリーナ横浜で開くと8月に発表した。
phase: phase3
relatedSongs: []
evidence: 昨年6月の初開催に続き2度目となる今回の「CEREMONY」は2日間の日程で実施される。
