date: "2018-12-26"
title: 「僕のこと」が全国高校サッカー選手権の応援歌に、先行配信開始
kind: media
description: 2019年1月9日発売のシングル「僕のこと」は、第97回全国高校サッカー選手権大会（2018年12月30日〜2019年1月14日）の応援歌に使われた。12月26日にMV（ショート版）が公開され、同日から先行配信が始まった。大会の決勝戦ではMrs. GREEN APPLEのライブパフォーマンスが予定された。
phase: phase1
relatedSongs: [僕のこと]
evidence: 同曲は、「第97回全国高校サッカー選手権大会」の応援歌に起用されており、本日から先行配信がスタートしている。
