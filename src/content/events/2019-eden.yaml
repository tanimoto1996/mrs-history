title: 初の全国アリーナツアー『エデンの園』
kind: live
description: 2019年12月から初の全国アリーナツアー「ARENA TOUR / エデンの園」を行い、東名阪公演は即日ソールドアウトとなった。2019年10月に大阪城ホール（2020年2月10日）と国立代々木競技場第一体育館（2月15日・16日）の追加公演が発表された。横浜アリーナ、ドルフィンズアリーナ、大阪城ホール、代々木第一体育館の4カ所7公演で、計8万人を動員した。12月8日の横浜アリーナ公演は、2020年7月に映像作品として出た。
