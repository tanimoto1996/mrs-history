title: ユニバーサル ミュージック グループと「Project-MGA」発足
kind: milestone
description: 活動休止中の2021年2月4日、ユニバーサル ミュージック グループと組み、Mrs. GREEN APPLEの活動を世界に広げるための新プロジェクト「Project-MGA」を発足させると発表した。2020年7月の活動休止後、所属事務所からの独立と新プロジェクトの始動を発表しており、その具体的な形として示された。
phase: hiatus
relatedSongs: []
evidence: 「Project-MGA」は「最高のエンタテインメントで世界中の人々にワクワクとドキドキを提供し続ける」というビジョンを掲げ、Mrs. GREEN APPLEの活動を世界中に展開するためのプロジェクト。
