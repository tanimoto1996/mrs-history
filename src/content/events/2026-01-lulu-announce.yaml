date: "2026-01-01"
title: フェーズ3第1弾「lulu.」を発表、ドーム会場の“手紙”が布石に
kind: release
description: 1月1日、フェーズ3の第1弾として新曲「lulu.」を1月12日に配信すると発表した。ドームツアー「BABEL no TOH」の会場では「愛しのluluへ」で始まる手紙形式のフライヤーが配られ、元日の読売新聞朝刊には「lulu. 2026.1.12」とだけ載った広告が出ていた。
phase: phase3
relatedSongs: [lulu]
evidence: 「DOME TOUR 2025 “BABEL no TOH”」の会場では、「愛しのluluへ」の書き出しでつづられる手紙形式のフライヤーが配布され、ファンの間ではさまざまな考察や憶測が飛び交っていた。
