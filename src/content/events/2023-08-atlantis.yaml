date: '2023-08-12'
title: 初のドームライブ『DOME LIVE 2023 “Atlantis”』
kind: live
description: 結成10周年の節目に、8月12日・13日の2日間、埼玉・ベルーナドームで初のドームライブを開催した（チケットは6月に完売）。13日の公演では約3万5千人を前にアンコールでファンクラブツアー『The White Lounge』を発表し、終演後のスクリーンには続編『“BABEL no TOH”』の制作決定が映し出された。
phase: phase2
relatedSongs: []
evidence: 終演後のスクリーンには「To Be Continued To “BABEL no TOH”」とのメッセージが突如映し出され、客席が大きくどよめいた。
