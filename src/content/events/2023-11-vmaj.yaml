title: 「MTV VMAJ 2023」で史上初の4冠
kind: award
description: 「MTV VMAJ 2023」で、Artist of the Year、「Magic」のBest Alternative Video、「ケセラセラ」のBest Visual Effectsの三冠が10月に発表され、11月22日の授賞式では「ケセラセラ」MVが最優秀ビデオ賞「Video of the Year」も受賞し、開催史上初の4冠になった。授賞式ではライブも披露した。
phase: phase2
relatedSongs:
