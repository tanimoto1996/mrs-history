description: 2016年10月29日、バンドがキュレーターとなるハロウィンイベントを赤坂BLITZで開催した。LILI LIMITとサイダーガールが出演し、オープニングアクトとして20歳未満限定でMrs. GREEN APPLEのコピーバンドも募集した。前年に赤坂BLITZのハロウィンイベント「AKASAKA HALLOWEEN 2015」に出演したことが開催のきっかけとなった。
