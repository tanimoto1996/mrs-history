date: "2017-07-08"
title: 約2年ぶりの自主企画『ゼンジン未到とロワジール』を大阪城野音・日比谷野音で開催
kind: live
description: インディーズ期に3回行った自主企画「ゼンジン未到」を、7月8日に大阪城野外音楽堂、15日に日比谷野外大音楽堂で開催した。日比谷公演ではミニアルバム『Progressive』の曲を多く演奏し、新曲「On My MiND」「WanteD! WanteD!」を披露した。
phase: phase1
