date: "2026-04-05"
title: 大森元貴が2029年までのライブ構想を発表
kind: milestone
description: 4月5日、ファンクラブ「Ringo Jam」10周年記念イベント「PMGA SUMMIT about PHASE-3」で、大森元貴が中長期の計画を自ら発表した。2026年秋のファンクラブ限定アリーナツアー“SHADOWS”（13カ所28公演）、2027年の「on Harmony 2」と衣装展、2028年のストーリーライン最新作「ELYSIUM」、2029年の「The White Lounge 2」（仮）という内容で、3年先まで公開するのは音楽業界では異例とされた。
phase: phase3
relatedSongs: []
evidence: 2028年にストーリーラインの最新作「ELYSIUM」、2029年にライブ「The White Lounge 2」（仮）を行うことを発表した。3年も先におよぶスケジュールをあらかじめ公開するのは、音楽業界では異例のことだ。
