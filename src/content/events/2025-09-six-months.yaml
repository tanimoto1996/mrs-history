date: "2025-09-28"
title: バンド史上最多の6カ月連続配信を「GOOD DAY」で達成
kind: release
description: 4月の「クスシキ」から、5月「天国」、6月「breakfast」、7月「Carrying Happiness」、8月「夏の影」と毎月新曲を配信し、9月28日の「GOOD DAY」で6カ月連続配信になった。前年の5カ月連続を上回るバンド史上最多。大森元貴は「GOOD DAY」を2025年最後のリリースと明かした。
phase: phase2
relatedSongs: [クスシキ, 天国, breakfast, carrying-happiness, 夏の影, good-day]
evidence: 昨年の5カ月連続配信を上回る、バンド史上最多となる6カ月連続配信を達成することになる。
