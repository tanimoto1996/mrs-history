date: "2015-12-24"
title: 『Mrs. ONEMAN TOUR～東と名と阪～』ファイナルを恵比寿LIQUIDROOMで開催
kind: live
description: 東名阪ワンマンツアーのファイナルを2015年12月24日に恵比寿LIQUIDROOMで開催した。「クリスマスプレゼント」として未発表曲「うブ」が演奏され、ダブルアンコールでは2016年1月13日発売の1stフルアルバム『TWELVE』から「パブリック」が披露された。
phase: phase1
relatedSongs: [うブ, リスキーゲーム]
evidence: クリスマスプレゼントをあげようと思います！ どこでもやったことのない、未発表の曲！
