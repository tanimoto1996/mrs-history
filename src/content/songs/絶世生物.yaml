      - sec-arai-zesseiseibutsu
    evidence: 誰もが心のどこかで感じる揺らぎを、真正面から見つめた内省的な作品
  - kind: secondary
    text: 自分の価値が他人に壊されたとしても「零からやり直せる」と自分に言い聞かせるような、回復への希望を歌った曲だと紹介されている。
    sources:
      - sec-arai-zesseiseibutsu
    evidence: 「零からやり直せる」という言葉。たとえ自分の価値が他人に壊されたとしても
