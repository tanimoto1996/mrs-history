background:
  - kind: official
    text: 大森元貴は、映画の台本で「ここまでは台詞が流れるが、曲の歌詞で必要なことを言えていれば台詞がなくなっても大丈夫」という難しい注文を受けて詞を書いたと明かしている。
    sources:
      - spice-2018-aotonatsu
    evidence: 『でも曲の歌詞で（必要なことを）言えていたら、この台詞がなくなっても大丈夫です』っていう、ものすごいオーダーをいただいて。
  - kind: official
    text: 映画制作チームが曲を活かす形で使ってくれたことについて、大森元貴は「自分たちも映画に参加できた」という気持ちにさせてもらえて嬉しかったと語っている。
    sources:
      - spice-2018-aotonatsu
    evidence: 『僕らも参加できた』っていう気持ちにさせてもらえるような曲の使い方をしてくださっていたので、すごく嬉しかったですね。
