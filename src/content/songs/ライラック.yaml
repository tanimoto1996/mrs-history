background:
  - kind: official
    text: 大森元貴は、TVアニメ『忘却バッテリー』のタイアップ・オファーを受けて、眩しい青春とその裏にある影の両方を「奇しくも愛すべきもの」だと考えたと語り、主人公たちの"青"をしっかり見つめたいという思いを明かしている。
    sources:
      - billboard-2024-lilac-tieup
    evidence: 眩しい青春。の裏には必ず長く伸びてる影があります。疎ましい青春。
  - kind: official
    text: 大森元貴は「大人が思う青春」を書きたいと考え、ライラックの花の色を「青と夏」よりも渋みの加わった青紫にたとえながら、この曲を「青と夏」のアンサーソングに近い感覚で作ったと説明している。
    sources:
      - billboard-2024-interview
    evidence: 「青と夏」がピカピカの青だとすれば、ちょっと年齢が上がっているんだけど
  - kind: official
    text: 大森元貴は、楽曲のスケール感が大きくなり続け、説教くさくなるのが嫌だったことから、ワクワクしながらギターをかき鳴らすような曲を作ろうとしたことが「ライラック」の始まりだったと述べている。
    sources:
      - billboard-2024-interview
    evidence: 僕らがワクワクしながらギターを持って、かき鳴らすというのをやろうよ、みたいなところが「ライラック」の始まりだった
