background:
  - kind: official
    text: 大森元貴は、約2年の活動休止を経てフェーズ2最初の新曲を作るにあたり、闘志や期待よりも今までへの感謝を込め、地に足がついた曲でなければ届かないと考えてこの曲を作ったと説明している。誰に聴かせても恥ずかしくない曲にしたいという思いから「ニュー・マイ・ノーマル」というタイトルを付けたという。
    sources:
      - skream-2022-unity
    evidence: 地に足がついた楽曲を作らないと、きっと届かないものになっちゃうなと思ったんです
  - kind: official
    text: タイトルについて大森元貴は、"ニュー・ノーマル"という言葉に"マイ"を付けたものだと述べ、変わらなければならないことは多くても、変わらない部分もあることを伝えるためにこの曲が必要だったと語っている。
    sources:
      - skream-2022-unity
    evidence: 変わんなきゃいけないことも、順応しなきゃいけないことも疲弊するぐらいたくさんあるけど、変わらないところもちゃんとあるんだよ
