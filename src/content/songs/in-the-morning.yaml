background:
  - kind: official
    text: 大森元貴は、20歳を迎える節目に自分たちのやりたいことを見つめ直す気持ちで「In the Morning」を制作したと語っている。バンドをストーリーとして描いていきたいという意識から、20歳になったら音楽性が一度振り出しに戻るだろうと結成当時から考えていたという。
    sources: [musica-2016-inthemorning]
    evidence: "二十歳をきっかけにもう一度自分らのやりたいことを見返してみたというか"
  - kind: official
    text: 大森元貴は、10代の活動を振り返り、当時は劣等感の中で「音楽をやるしかなかった自分」だったが、今は「音楽をやりたい自分」に変わることができたと述べている。
    sources: [musica-2016-inthemorning]
    evidence: "『音楽をやるしかなかった自分』から、『音楽をやりたい自分』にやっと変わっていった"
