background:
  - kind: secondary
    text: 大森が当時のインタビューで「全てに対して気持ち悪いロックを作りたかった」と語ったと紹介されており、収録アルバム『TWELVE』全8曲の中で最もダークな楽曲として話題になったとされる。
    sources:
      - sec-arai-misukasazu
    evidence: 「全てに対して気持ち悪いロックを作りたかった」と語っています
  - kind: secondary
    text: 誰かと心から繋がりたいと願う自分と、その願いは叶わないと諦める自分という相反する感情を描いた曲だとファンブログで解釈されている。
    sources:
      - sec-arai-misukasazu
    evidence: 孤独な世界から連れ出してくれる誰かに出会いたいと願う主人公と、そんな願いは叶うはずないと諦める主人公
  - kind: secondary
    text: MVは「やりきれない思いの中にほのかな希望が滲み出る楽曲の世界観」というテーマで制作されたと紹介されている。
    sources:
      - sec-salute-misukasazu
    evidence: やりきれない思いの中にほのかな希望が滲み出る楽曲の世界観
