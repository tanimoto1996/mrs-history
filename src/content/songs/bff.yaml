background:
  - kind: secondary
    text: タイトルの「BFF」は「Best Friends
      Forever」の略とされ、日々ふつうに一緒に過ごす今日が続くこと自体を「永遠」として描いた曲だと紹介されている。
    sources:
      - arai-hikidashi-bff
    evidence: つまり、永遠とは非現実的なものではなく、「毎日、ふつうに一緒に過ごす今日」が続いていく
  - kind: secondary
    text: 1番はメンバーの若井滉斗、2番は藤澤涼架へ向けたメッセージとして読むファンの声もあるが、公式な明言はないと紹介されている。
    sources:
      - arai-hikidashi-bff
    evidence: ファンの間では1番＝若井滉斗、2番＝藤澤涼架へ向けたメッセージとして読む声もあります
