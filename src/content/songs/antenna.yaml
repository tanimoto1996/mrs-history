background:
  - kind: official
    text: 藤澤涼架は、「ANTENNA（アンテナ）」という言葉はバンド結成当時からメンバーやスタッフの間で使っていた共通言語で、「気を張っていこう・集中していこう」という意味合いで使っていたと説明している。
    sources: [natalie-2023-antenna-volleyball]
    evidence: "“アンテナ張っていこう”とか、“アンテナを立てていこう”という捉え方をしていたんですけど"
  - kind: official
    text: 大森元貴は、この曲がバレーボール日本代表応援ソングに選ばれたことについて、自身がバレーボール好きであることに触れ、思い入れがあるためうれしいとコメントしている。
    sources: [natalie-2023-antenna-volleyball]
    evidence: "実は僕、バレーボールが本当に大好きで。母がバレーボールをやっていたこともあり"
  - kind: official
    text: 大森元貴は、オリンピック出場をかけた大会に向けて選手たちの後押しができればと述べ、応援する思いを語っている。
    sources: [natalie-2023-antenna-volleyball]
    evidence: "オリンピック出場へ、僕らもアンテナを立てて全力で応援したいと思います"
