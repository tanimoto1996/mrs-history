    evidence: 何も考えず流されるままに生きることなのだ
  - kind: secondary
    text: 「何が欲しくて何が要らないか」という浅い判断だけで人間関係を築く危うさを問いかけ、自分自身と真剣に向き合うよう促す楽曲だと解釈されている。
    sources:
      - arai-hikidashi-naniwonaniwo
    evidence: 所詮それくらいしか考えていないのでしょう
