background:
  - kind: official
    text: 大森元貴は、18〜19歳の頃に作った曲だとふり返り、20代半ばを迎えた今も自分にとって思い入れの強い曲だと語っている。
    sources:
      - livedoor-2020-speaking
    evidence: 当時の自分も思い出させてくれるし、ライブでやってもとても盛り上がる曲ですし
  - kind: official
    text: ドラマー山中綾華は、TWELVE収録曲と合宿でまとめてレコーディングした際、学生時代の焦燥感を思い出しながら録音したと話している。
    sources:
      - livedoor-2020-speaking
    evidence: 学生のころってこういう悩みあったよねーとか、すごいモヤモヤっとした気持ちとか焦燥感をすごい思い出したり
  - kind: official
    text: ベースの郄野清宗は、メジャーデビュー後すぐにリリースされたこの曲がきっかけでバンドを知ったというファンが多いと述べている。
    sources:
      - livedoor-2020-speaking
    evidence: この曲をきっかけにしてくれた人っていうのがすごくたくさんいてくれて
