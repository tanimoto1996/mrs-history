background:
  - kind: secondary
    text: 「孤独」を単なる寂しさではなく、愛の形を誤解したまま彷徨う人間の本質として描いた曲だとファンブログで考察されている。
    sources:
      - sec-note-loneliness
    evidence: 愛の形を誤解したまま彷徨う人間の本質として描いているように感じました
  - kind: secondary
    text: 歌詞に描かれる愛し方は相手を思いやる愛ではなく自分の心の空白を埋めるための依存的な愛であり、愛せば愛するほど孤独が増幅するという矛盾（パラドックス）を抱えていると解釈されている。
    sources:
      - sec-note-loneliness
    evidence: 愛せば愛すほど孤独を増幅させるという点から、自己保存本能の落とし穴
