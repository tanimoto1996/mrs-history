    text: 魅力を感じていなかったはずの相手に恋をしてしまい、その理由が分からないまま思いを告げられずにいる主人公の戸惑いを描いた曲だと紹介されている。
    sources:
      - arai-hikidashi-propose
    evidence: 華がないと感じていた君に恋する自分がいることに気が付きます。
  - kind: secondary
    text: 自分が相手を必要としていても、相手も自分を必要としているのか確信が持てず、最後には孤独だけが残る心情が歌われていると解釈されている。
    sources:
      - arai-hikidashi-propose
    evidence: 結局独りで寂しい自分が居るという事実だけなのです
