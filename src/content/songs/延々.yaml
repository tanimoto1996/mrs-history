background:
  - kind: secondary
    text: 「延々と愛すには 君がいない」という一節について、単なる不在の悲しみではなく、君がいないことでしか叶えられなかった永遠への願いという矛盾を描いているとファンの考察noteで紹介されている。
    sources:
      - note-kao407-enen
    evidence: 永遠を願ったのに、“君がいない”ことでしか叶えられなかった矛盾
  - kind: secondary
    text: 手にした瞬間に形を変えてしまうという普遍的なテーマは恋愛に限らず、夢や音楽など、すべての「願い」に通じるものとして解釈されている。
    sources:
      - note-kao407-enen
    evidence: すべての“願い”って、叶った瞬間から形を変えてしまう
