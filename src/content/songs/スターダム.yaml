background:
  - kind: official
    text: 「スターダム」は2014年に自主盤としてリリースされたファーストミニアルバム『Introduction』収録曲を、ベストアルバム「5」に際して改めて録音し直した楽曲。メンバーは、当時聴き直した原曲について「荒削りながらも初期衝動に満ちていた」と語っている。
    sources:
      - um-bestalbum5-liner01
    evidence: 荒削りながらも初期衝動に満ちていた
  - kind: interpretation
    text: 歌詞の「失くしたくないから／僕はずっとこうやってるの」という一節は、『Introduction』のコンセプトである「形あるものはいつか必ずなくなる」という無常観と重なり、生と喪失の中で意味を掴み取ろうとする歌として読める。
    basis: 歌詞の該当箇所と、um-bestalbum5-liner01に記された『Introduction』のコンセプト説明
    sources:
      - um-bestalbum5-liner01
