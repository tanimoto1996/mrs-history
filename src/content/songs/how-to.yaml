background:
  - kind: official
    text: 大森元貴は、2年前のシングル「WanteD! WanteD!」の音像から派生した曲だと語っており、制作は難航せず完成したという。
    sources:
      - usen-2019-romanticism
    evidence: 音像としては2年前の「WanteD! WanteD!」あたりからの派生だと思うんです
  - kind: official
    text: ベースの髙野清宗は、大森が打ち込んだシンセベースに自身のエレキベースを重ね、生音と打ち込みのコントラストを効かせたアレンジになったと説明している。
    sources:
      - usen-2019-romanticism
    evidence: ここは生のベース、ここはシンセベースっていうコントラストが効いたアレンジになった
