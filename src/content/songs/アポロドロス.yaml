background:
  - kind: official
    text: 大森元貴は、この曲がパリ五輪の中継のための書き下ろしであることを、光栄に思うと語っている。
    sources:
      - mantan-2024-apollodoros
    evidence: 壮大に、かつ繊細にエネルギーを描きたいと率直に思いました
  - kind: official
    text: 楽曲は約10年前にオリンピックを意識して書いた曲との2部構成（組曲）になっていると、大森元貴が明かしている。
    sources:
      - mantan-2024-apollodoros
    evidence: 10年ほど前に、当時オリンピックを意識して描いた曲との2部構成になっていて、組曲になっています
  - kind: official
    text: 曲のテーマについて、大森元貴は「静と動」だと説明している。
    sources:
      - mantan-2024-apollodoros
    evidence: 闘争心、激動な思いと、安らぐリラックスした壮大なゾーンみたいなもの、静と動がテーマだったりします
  - kind: official
    text: 楽曲の後半部分には、大森元貴が2015年にオリンピックをテーマにして書いた「命の花」という曲が用いられている。
    sources:
      - natalie-2026-apollodoros-bts
    evidence: 後半部は2015年に大森元貴（Vo, G）がオリンピックをテーマにして書いた楽曲「命の花」が用いられた
  - kind: official
    text: 「アポロドロス ～2026 winter version～」は、パリ2024オリンピックに続き、ミラノ・コルティナ2026冬季オリンピックのテレビ朝日系列スポーツ応援ソングにも選ばれ、冬季五輪向けに新たなアレンジが施された。
    sources:
      - natalie-2026-apollodoros-bts
    evidence: 冬季五輪のために新たなアレンジを施された「アポロドロス ～2026 winter version～」
