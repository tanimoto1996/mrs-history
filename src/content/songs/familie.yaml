background:
  - kind: official
    text: 大森元貴は、「familie」はドイツ語で「家族」を意味するが、家族の形にこだわらず、人と人とのつながりや温かさから着想を得たと語っている。
    sources:
      - natalie-2024-familie
    evidence: 家族がどうというよりは、人と人とのつながり、温かいものみたいなところから着想を得ました
  - kind: official
    text: 車という空間について、運転する人だけでなく後部座席の子どもや恋人など、いろいろな人と共有する場所であり、自分だけの時間を過ごす場所でもあると説明している。
    sources:
      - natalie-2024-familie
    evidence: 後部座席に乗られるお子さんだったり、恋人だったり、いろんな方と共有する場所
  - kind: official
    text: 歌詞の「僕に運ばれる街」について、「僕が運ばれてる」のではなく「僕が運んでるんだ」という感覚から生まれたと明かしている。
    sources:
      - natalie-2024-familie
    evidence: 『僕が運ばれてる』のではなく、『僕が運んでるんだ』という感覚があって
  - kind: official
    text: 窓の外を見る子どもにとって移り変わる景色が絵画のように見えるイメージから、温かく鮮やかな楽曲として描きたかったと述べている。
    sources:
      - natalie-2024-familie
    evidence: 景色が変わっていく様子とかって、僕は絵画のようだなって思って
