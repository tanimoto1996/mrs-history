      - sec-arai-soup
    evidence: どんなに温かいスープもいつかは冷めてしまうように、この僕の思いもいつかは冷めてしまうのかな？
  - kind: secondary
    text: 一方で「スープ」には、相手が冷え切ったときにそっと温める存在でありたいという前向きな願いも込められていると解釈されている。
    sources:
      - sec-arai-soup
    evidence: 温かいスープのようにそっと君を温め癒やすことが出来るような存在になりたい
